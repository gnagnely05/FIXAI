name: Build Android APK (Expo EAS)

on:
  push:
    branches:
      - main
      - claude/sharp-ritchie-vipv7y
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --ignore-engines --prefer-offline

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Setup Java (required for Android local build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK (EAS local)
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive --output build-output.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixai-android-apk
          path: apps/mobile/build-output.apk
          retention-days: 30
          if-no-files-found: warn
