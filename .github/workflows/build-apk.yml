name: Build Android APK (Expo EAS)

on:
  push:
    branches:
      - main
      - claude/sharp-ritchie-vipv7y
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install root dependencies
        run: npm install

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Build Android APK (local)
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixai-android-apk
          path: apps/mobile/build-*.apk
          retention-days: 30
          if-no-files-found: warn
