name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/sharp-ritchie-vipv7y
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js + Yarn ────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install monorepo dependencies
        run: yarn install --ignore-engines --network-timeout 300000

      # ── EAS Build (Expo Cloud Build) ───────────────────────────────────────
      - name: Build APK with EAS (preview profile → APK)
        id: eas_build
        working-directory: apps/mobile
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --wait \
            --non-interactive \
            2>&1 | tee /tmp/eas_output.txt
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_DISABLE_BUNDLE_JAVASCRIPT_STEP: 1

      # ── Extraire et afficher le lien de téléchargement ────────────────────
      - name: Afficher le lien de téléchargement APK
        if: always()
        run: |
          echo ""
          echo "======================================================"
          echo "  📱  FIXAI Android APK — Lien de téléchargement"
          echo "======================================================"

          # Extraire l'URL du fichier APK depuis les logs EAS
          APK_URL=$(grep -oP 'https://expo\.dev/artifacts/[^\s]+' /tmp/eas_output.txt | head -1 || true)

          # Extraire l'URL de la page du build EAS
          BUILD_URL=$(grep -oP 'https://expo\.dev/accounts/[^\s]+/builds/[^\s]+' /tmp/eas_output.txt | head -1 || true)

          if [ -n "$APK_URL" ]; then
            echo "  ✅ APK prêt à télécharger :"
            echo "  🔗 $APK_URL"
          elif [ -n "$BUILD_URL" ]; then
            echo "  ✅ Build terminé — Voir la page EAS pour le téléchargement :"
            echo "  🔗 $BUILD_URL"
          else
            echo "  ℹ️  Consulte les logs EAS ci-dessus pour le lien de téléchargement"
            echo "  🔗 https://expo.dev/accounts/fixaici/projects/fixai/builds"
          fi

          echo ""
          echo "  📲 QR Code disponible sur la page du build EAS"
          echo "======================================================"
