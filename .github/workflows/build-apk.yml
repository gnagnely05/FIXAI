name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/sharp-ritchie-vipv7y
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK with EAS
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js + Yarn ────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install monorepo dependencies
        run: yarn install --ignore-engines --network-timeout 300000

      # ── EAS Build (Expo Cloud Build) ───────────────────────────────────────
      - name: Build APK with EAS (preview profile → APK)
        working-directory: apps/mobile
        run: |
          npx eas-cli@latest build --platform android --profile preview --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── Display Build Status ───────────────────────────────────────────────
      - name: Build Success
        run: |
          echo "✅ APK build completed successfully!"
          echo "📱 Download link will be displayed in EAS Build console"
          echo "ℹ️  Check the build logs above for the download URL"
