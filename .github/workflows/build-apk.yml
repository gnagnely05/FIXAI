name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/sharp-ritchie-vipv7y
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js + Yarn ────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn classic)
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install monorepo dependencies
        run: yarn install --ignore-engines --network-timeout 300000

      # ── Java 17 (required for Gradle / Android build) ─────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Setup Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" 2>&1 | tail -5

      # ── Expo Prebuild → native Android project ────────────────────────────
      - name: Generate native Android project (expo prebuild)
        working-directory: apps/mobile
        run: |
          npx expo install --fix
          npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # ── Gradle build ──────────────────────────────────────────────────────
      - name: Build APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.useAndroidX=true \
            -Preact.packager.port=8081 2>&1 | tail -30
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── Upload APK artifact ───────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixai-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn
